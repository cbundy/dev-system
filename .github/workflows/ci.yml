name: CI

# The always-on gate (cbundy/dev-system#137): `npm run lint` and `npm test` on
# every pull request and every push to main. No `paths` filter: branch
# protection requires this check, and a required check that does not run on a
# PR would block it forever.
#
# The job id and name `ci` is the status check name branch protection requires (and
# release.yml reads).
# Keep it stable; renaming it silently drops the requirement until the branch
# protection setting is updated to match.
#
# Three kinds of job run in parallel: `lint`, `test (K/N)` (one matrix leg per shard of
# `npm test`, TEST_SHARD=K/N; see docs/architecture.md#test-runner) and a final `ci` job that
# needs them all and fails unless every one succeeded. `ci` is the one required check; the
# shard legs are not, so a shard that never ran still turns `ci` red. N is the matrix list below,
# the only place it is written: TEST_SHARD derives from the matrix value.
#
# What it covers:
# - `npm run lint` (scripts/lint.sh): shellcheck over the repo's shell scripts,
#   node --check, the generated-skill drift check against docs/, and terraform
#   fmt -check, init and validate on coder/dev-system. LINT_REQUIRE_TERRAFORM=1
#   makes a missing terraform fail instead of skipping.
# - `npm test`: runs the callum-dev bin end-to-end (init, update
#   merges/conflicts, check) in scratch dirs, so template shape changes that
#   break the CLI's assumptions fail here, plus plugins/callum-flow's hook tests
#   (dev-system#52), the callum-tools script tests and every mod's validation and
#   tests (claude plugin validate / test; TEST_REQUIRE_CLAUDE=1).
# The heavy, path-filtered image and feature workflows stay separate and
# optional.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel a PR's superseded runs; every push to main runs to completion.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # terraform is the version the dev image pins (.devcontainer/Dockerfile),
      # read from there so the two never drift.
      - name: Read the dev image's terraform version
        id: tf
        run: |
          version=$(sed -n 's/^ARG TERRAFORM_VERSION=//p' .devcontainer/Dockerfile)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No ARG TERRAFORM_VERSION=X.Y.Z in .devcontainer/Dockerfile (got '$version')."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      # ubuntu-latest ships shellcheck; printing its version fails the step if
      # it is missing, so lint can never silently drop to syntax-only checks.
      - name: Check shellcheck
        run: shellcheck --version

      - name: Lint
        env:
          LINT_REQUIRE_TERRAFORM: "1"
        run: npm run lint

  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The one place the shard count is written: 1..N.
        shard: [1, 2, 3]
    # A real PostgreSQL for the database tests (scripts/test-pg.sh, cbundy/dev-system#646): they
    # make and drop their own databases on this shared server, and npm test fails on a leftover.
    # Each matrix leg has its own service container.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Claude Code validates and tests the mods (plugins/*/ with a hooks module); it
      # needs no login for that. Latest, as the image installs it, so a release that
      # breaks a mod fails here. TEST_REQUIRE_CLAUDE=1 makes a missing claude fail
      # instead of skipping.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version

      - name: Test
        env:
          TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          TEST_REQUIRE_CLAUDE: "1"
          TEST_REQUIRE_POSTGRES: "1"
          FACTORY_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: npm test

  # The required check. Fails closed: it runs even when a needed job failed, was cancelled or
  # was skipped, and passes only when every one succeeded.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Require every job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(to_entries[]; .value.result == "success")' > /dev/null
