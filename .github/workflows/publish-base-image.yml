name: Publish base image

# Builds and tests ghcr.io/cbundy/dev-system/base (images/base/), and pushes it
# on a deliberate release or the weekly refresh:
#
# - pull_request: build + test only, never pushes.
# - workflow_dispatch: the deliberate release - build, test, push the tags for
#   the version in images/base/VERSION (matching publish-features.yml).
# - schedule (weekly): rebuild with fresh OS packages and the latest tools and
#   re-push the current VERSION's tags. Tags are mutable by design (see
#   images/base/README.md). Only a version that has already been released by
#   hand is refreshed, so a merged VERSION bump never publishes itself.
on:
  pull_request:
    paths:
      - "images/base/**"
      - "features/src/callum-tools/**"
      - ".github/workflows/publish-base-image.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: publish-base-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/cbundy/dev-system/base

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute version and tags
        id: meta
        run: |
          version=$(tr -d '[:space:]' < images/base/VERSION)
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "images/base/VERSION must be MAJOR.MINOR.PATCH, got '$version'" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          today=$(date -u +%Y%m%d)
          short_sha=${GITHUB_SHA::7}
          {
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # One cache key per day: same-day rebuilds reuse layers, the weekly
            # run always reinstalls the tools and OS packages.
            echo "cache_bust=$today"
            echo "tags<<EOF"
            for tag in "$major" "$major.$minor" "$version" "$version-$today" "sha-$short_sha"; do
              echo "$IMAGE:$tag"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to push
        id: push
        env:
          EVENT: ${{ github.event_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          case "$EVENT" in
            workflow_dispatch) push=true ;;
            schedule)
              # Refresh only a version that was already published deliberately.
              if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
                push=true
              else
                echo "$IMAGE:$VERSION is not published yet - run this workflow by hand to release it." >> "$GITHUB_STEP_SUMMARY"
                push=false
              fi
              ;;
            *) push=false ;;
          esac
          echo "push=$push" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          pull: true
          load: true
          tags: dev-system-base:test
          build-args: |
            CACHE_BUST=${{ steps.meta.outputs.cache_bust }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=base-image
          cache-to: type=gha,scope=base-image,mode=max

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test image
        run: images/base/test/test.sh dev-system-base:test

      - name: Log in to GHCR
        if: steps.push.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same inputs as the tested build, so every layer comes from the cache
      # and the pushed image is the one the tests ran against.
      - name: Push image
        if: steps.push.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/base/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            CACHE_BUST=${{ steps.meta.outputs.cache_bust }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          cache-from: type=gha,scope=base-image

      - name: Summary
        if: steps.push.outputs.push == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
