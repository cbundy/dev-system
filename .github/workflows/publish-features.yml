name: Publish features

# Manual, on-demand only, matching the release policy: publishing a feature
# version to GHCR is a deliberate step. The devcontainers action only pushes
# a version that does not already exist in the registry, so re-runs are safe
# and publishing requires the version in devcontainer-feature.json to have
# been bumped in the change being released.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish features to GHCR
        uses: devcontainers/action@v1
        with:
          publish-features: "true"
          base-path-to-features: "./features/src"
          generate-docs: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
