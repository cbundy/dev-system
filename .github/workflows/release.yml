name: Release

# Manual, on-demand only: never triggers on push/merge to main, and never pushes
# to main. The version bump and this repo's stamp refresh land first in a normal
# PR made with `node scripts/release-bump.js X.Y.Z` (see RELEASING.md); this
# workflow then checks main is at that version with a green `ci` check, tags it
# and creates the GitHub Release. Run from the Actions tab or
# `gh workflow run release.yml -f version=X.Y.Z`.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver version to release, e.g. 0.2.0 (no leading 'v')"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  checks: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: needed to validate the tag doesn't already
          # exist and to find the previous release tag for release notes.
          fetch-depth: 0

      - name: Ensure running from main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::This workflow must be run from main (got '${{ github.ref }}'). Releases are cut only from main to keep tags/history trunk-based."
            exit 1
          fi

      - name: Validate version input
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$RELEASE_VERSION' is not a valid semantic version (expected e.g. 1.2.3)"
            exit 1
          fi
          if git rev-parse "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
              echo "::error::v$RELEASE_VERSION has already been fully released (tag and GitHub Release both exist)"
              exit 1
            fi
            echo "Tag v$RELEASE_VERSION already exists but no GitHub Release does - resuming a failed release attempt."
          fi

      - name: Require a green ci check on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        # Branch protection gates the bump PR; this makes sure the exact commit being
        # tagged also passed `ci` on main, not just its PR branch.
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/check-runs?check_name=ci" \
            --jq '[.check_runs | sort_by(.started_at) | reverse | .[] | .conclusion // .status] | first // "missing"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::The ci check on $GITHUB_SHA is '$conclusion', not 'success'. Wait for ci to pass on main (or fix it), then re-run Release."
            exit 1
          fi

      - name: Check versions were bumped in a PR
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        # The bump never happens here: this workflow never pushes to main. Every
        # plugin.json, SKILL.md, package.json and this repo's stamp must already say
        # the version, via a merged PR made with scripts/release-bump.js.
        run: |
          if ! node scripts/release-bump.js --check "$RELEASE_VERSION"; then
            echo "::error::main is not at v$RELEASE_VERSION. Run 'node scripts/release-bump.js $RELEASE_VERSION' on a branch, merge it in a PR once ci is green, then re-run Release (see RELEASING.md)."
            exit 1
          fi

      - name: Tag release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists - skipping tag/push (resuming a failed release attempt)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v${RELEASE_VERSION}" -m "v${RELEASE_VERSION}"
            git push origin "v${RELEASE_VERSION}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists - retrying: regenerating notes."
            gh release edit "v${RELEASE_VERSION}" --title "v${RELEASE_VERSION}"
          else
            gh release create "v${RELEASE_VERSION}" \
              --title "v${RELEASE_VERSION}" \
              --generate-notes
          fi
