name: Test features

# Real end-to-end verification: builds a container with each feature applied
# (lifecycle hooks included) and runs its test/ checks. This is the gate for
# feature changes - the dev container this repo is edited from cannot run
# docker-in-docker, so CI is where features actually get exercised.
on:
  pull_request:
    paths:
      - "features/**"
      - ".github/workflows/test-features.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    strategy:
      matrix:
        feature: [callum-tools]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Plain-shell tests that need no container build - runs directly on the
      # runner, so it fails fast and stays runnable with no Docker at all
      # (unlike the devcontainer-based step below, which is the only way this
      # repo's own dev container - no docker-in-docker - can exercise this).
      - name: Unit test no-mistakes auto-recovery script
        run: sh features/test/callum-tools/recover-no-mistakes.test.sh

      - name: Unit test codex model pin script
        run: sh features/test/callum-tools/pin-codex-model.test.sh

      # Authenticated pulls lift Docker Hub's anonymous rate limit. Skipped (anonymous
      # pulls) when the username or token is not set, e.g. fork PRs; a rejected
      # login fails the job.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Test feature against Node bookworm base
        run: |
          devcontainer features test \
            --project-folder ./features \
            --features ${{ matrix.feature }} \
            --base-image mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm
