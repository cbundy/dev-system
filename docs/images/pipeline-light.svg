<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 744 264" width="744" height="264" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12.5">
<title>The line: queued, design, build, review, merge queue, merged, with fix and parked side paths</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#818b98"/></marker></defs>
<rect x="16" y="16" width="728" height="248" rx="12" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="32" y="44" font-size="13" font-weight="600" fill="#1f2328">The line</text>
<text x="724" y="44" font-size="11.5" text-anchor="end" fill="#59636e">every state has a timeout</text>
<rect x="32" y="64" width="102" height="72" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="44" y="86" font-size="13" font-weight="600" fill="#1f2328">Queued</text>
<text x="44" y="106" font-size="11" fill="#59636e">issue labelled</text>
<text x="44" y="121" font-size="11" fill="#59636e">ready</text>
<rect x="150" y="64" width="102" height="72" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="162" y="86" font-size="13" font-weight="600" fill="#1f2328">Design</text>
<text x="162" y="106" font-size="11" fill="#59636e">designer writes</text>
<text x="162" y="121" font-size="11" fill="#59636e">a brief</text>
<rect x="268" y="64" width="102" height="72" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="280" y="86" font-size="13" font-weight="600" fill="#1f2328">Build</text>
<text x="280" y="106" font-size="11" fill="#59636e">builder, in its</text>
<text x="280" y="121" font-size="11" fill="#59636e">own worktree</text>
<rect x="386" y="64" width="102" height="72" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="398" y="86" font-size="13" font-weight="600" fill="#1f2328">Review</text>
<text x="398" y="106" font-size="11" fill="#59636e">reviewer</text>
<text x="398" y="121" font-size="11" fill="#59636e">and CI</text>
<rect x="504" y="64" width="102" height="72" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="516" y="86" font-size="13" font-weight="600" fill="#1f2328">Merge queue</text>
<text x="516" y="106" font-size="11" fill="#59636e">rebase on main,</text>
<text x="516" y="121" font-size="11" fill="#59636e">then merge</text>
<rect x="622" y="64" width="102" height="72" rx="8" fill="#1a7f37" fill-opacity="0.12" stroke="#1a7f37" stroke-width="1.5"/>
<text x="634" y="86" font-size="13" font-weight="600" fill="#1f2328">Merged</text>
<text x="634" y="106" font-size="11" fill="#59636e">shipped in the</text>
<text x="634" y="121" font-size="11" fill="#59636e">next release</text>
<path d="M134 100H150" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M252 100H268" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M370 100H386" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M488 100H504" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M606 100H622" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="386" y="176" width="102" height="68" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="398" y="198" font-size="13" font-weight="600" fill="#1f2328">Fix</text>
<text x="398" y="218" font-size="11" fill="#59636e">fixer answers</text>
<text x="398" y="233" font-size="11" fill="#59636e">the review</text>
<path d="M425 136V176" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M449 176V136" fill="none" stroke="#818b98" stroke-width="1.25" marker-end="url(#a)"/>
<text x="418" y="160" font-size="11" text-anchor="end" fill="#59636e">changes</text>
<text x="456" y="160" font-size="11" fill="#59636e">fixed</text>
<rect x="150" y="176" width="220" height="68" rx="8" fill="#f6f8fa" fill-opacity="1" stroke="#d1d9e0" stroke-width="1.25"/>
<text x="162" y="198" font-size="13" font-weight="600" fill="#1f2328">Parked</text>
<text x="162" y="218" font-size="11" fill="#59636e">a question for you on the issue;</text>
<text x="162" y="233" font-size="11" fill="#59636e">answer it and the issue requeues</text>
<path d="M319 136V176" fill="none" stroke="#818b98" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#a)"/>
<path d="M150 210H83V136" fill="none" stroke="#818b98" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="326" y="160" font-size="11" fill="#59636e">stuck</text>
<text x="90" y="160" font-size="11" fill="#59636e">answered</text>
<text x="622" y="198" font-size="11" fill="#59636e">Code drives every</text>
<text x="622" y="213" font-size="11" fill="#59636e">arrow; agents do</text>
<text x="622" y="228" font-size="11" fill="#59636e">the work in a box.</text>
</svg>
