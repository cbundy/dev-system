# no-mistakes pipeline config.
# Marker convention (see templates/README.md for the full explanation):
#   "synced" blocks are owned by dev-system and overwritten by `callum-dev update`.
#   "repo-owned" blocks are yours - `callum-dev update` merges around them and never clobbers them.

# --- repo-owned: edit freely ---
# Fill in this repo's real lint/test commands. Fresh no-mistakes worktrees have no
# dependencies installed, so if your package manager needs an install step, run it
# here before the actual command - do not assume node_modules/vendor/etc. already exist.
# This repo uses only Node built-ins and POSIX shell (no dependencies), so there is no
# install step. These are the canonical commands from CLAUDE.md.
commands:
  lint: "npm run lint"
  test: "npm test"

# Add repo-specific ignore paths below this line. Keep the synced defaults above intact.
ignore_patterns:
  - "vendor/**"
  - ".claude/**"

# Optional documentation ownership policy, read only from the trusted default branch.
# Delete this block if the repo has no special docs-ownership rule to state.
document:
  instructions: |
    docs/ owns architecture (docs/architecture.md) and onboarding (docs/onboarding.md).
    Each part's own README owns its reference: images/base/README.md,
    coder/dev-system/README.md, templates/README.md. The root README.md is a short
    landing page. RELEASING.md owns the release steps.
# --- end repo-owned ---

# --- synced: do not edit (managed by dev-system) ---
auto_fix:
  rebase: 3
  review: 3
  test: 3
  document: 3
  lint: 5
  ci: 3

agent: codex

# The codex model pin (agent_args_override / agent_config) is a GLOBAL-ONLY key: no-mistakes
# ignores it here without warning. It lives in the global no-mistakes config, written by
# the dev-system base image's dev-init (env DEV_CODEX_MODEL; images/base/README.md), or by
# the deprecated callum-tools feature (option `codexModel`).

# Optional sections below are synced defaults, commented out. Uncomment in a repo-owned
# block (do not uncomment here - dev-system updates will re-comment this synced copy) if
# this repo wants to opt in.

# commit:
#   fix_message: "chore(no-mistakes-{{.Step}}): {{.Summary}}"

# intent:
#   enabled: true
#   threshold: 0.2
#   slack_days: 3
#   disabled_readers: []

# test:
#   evidence:
#     store_in_repo: true
#     dir: .no-mistakes/evidence
# --- end synced ---
